}
/* Environments whose configured parameters are identical for the variables the
   calculations use, so a user is told rather than left to assume a difference. */
function twinEnvs(id){
  const e = ENV.find(x => x.id === id); if(!e) return [];
  return ENV.filter(x => x.id !== id && x.o2 === e.o2 && x.p === e.p && x.g === e.g).map(x => x.name);
}
/* Active scenario, shown wherever a calculation depends on it. */
function scenarioLine(b){
  const e = envOf(b), tw = twinEnvs(e.id), d = RELIX_DERIVED[e.id];
  return `<b>${esc(e.name)}</b> · ${nf(e.o2)} % O₂ · ${nf(e.p)} kPa (${nf(kpa2psi(e.p), 1)} psi) · O₂ partial pressure ${nf(pO2(e.o2, e.p), 1)} kPa ${lv(3)} · ${nf(e.g, 3)} g`
    + (tw.length ? `<div class="small muted">Identical configured parameters to: ${esc(tw.join(', '))}. Any difference between these environments is not represented in the oxygen, pressure or gravity used here.</div>` : '')
    + (d ? `<div class="small muted">Relevance ranking for this environment is derived, not rated: ${esc(d.why)}</div>` : '');
}
function win(st, k = 1){ return {o2: st.useO2 ? [st.o2 - st.tolO2 * k, st.o2 + st.tolO2 * k] : null, p: st.useP ? [st.p * (1 - st.tolP * k / 100), st.p * (1 + st.tolP * k / 100)] : null, fl: st.useFl ? [Math.max(0, st.fl - st.tolFl * k), st.fl + st.tolFl * k] : null}; }
/* A row is judged per variable, and a variable that is absent is reported as
   missing rather than as out of range: a test with no pressure recorded is not
   evidence that its pressure was wrong (commit 7). */
function rowVerdict(t, w){
  const missing = [], outside = [];
  if(w.o2){ if(!QV.o2(t)) missing.push('o2'); else if(t.o2b < w.o2[0] || t.o2a > w.o2[1]) outside.push('o2'); }
  if(w.p){ if(!QV.pressure(t)) missing.push('pressure'); else if(t.p < w.p[0] || t.p > w.p[1]) outside.push('pressure'); }
  if(w.fl){ if(!QV.flow(t)) missing.push('flow'); else { const a = t.fla ?? t.flb; if(t.flb < w.fl[0] || a > w.fl[1]) outside.push('flow'); } }
  return {ok: !missing.length && !outside.length, missing, outside};
}
const rowMatch = (t, w) => rowVerdict(t, w).ok;
/* Four compatibility states (commit 13) replace the in/out binary, so a gap in
   the data is never reported as a mismatch of conditions. */
const CSTATE = {
  match:   ['in',   'Experimental match',    'Critical variables are comparable and the measurements exist.'],
  partial: ['near', 'Partial match',         'Some critical variables match; others differ or are not recorded.'],
  related: ['out',  'Related evidence',      'Relevant to the problem, but its experimental conditions differ from this scenario.'],
  none:    ['',     'Insufficient evidence', 'No individual tests with the variables this comparison needs.']
};
function evalInv(v, st){
  const src = v.parent ? byId(v.parent) : v;
  // Only individual tests may be counted as comparable evidence (commit 8).
  const rows = src.tests.filter(isIndividual);
  const w = win(st), any = w.o2 || w.p || w.fl;
  const verdicts = rows.map(t => ({t, d: rowVerdict(t, w)}));
  const m = any ? verdicts.filter(x => x.d.ok).map(x => x.t) : rows;
  const wide = win(st, 2);
  let status = 'match';
  if(!rows.length) status = 'none';
  else if(any){
    if(m.length) status = 'match';
    else if(rows.some(t => rowMatch(t, wide))) status = 'partial';
    else if(verdicts.some(x => x.d.missing.length && !x.d.outside.length)) status = 'partial';
    else status = 'related';
  }
  // Why the status came out as it did, for the explanation shown in the table.
  const missCount = {}; verdicts.forEach(x => x.d.missing.forEach(k => missCount[k] = (missCount[k] || 0) + 1));
  const outCount = {}; verdicts.forEach(x => x.d.outside.forEach(k => outCount[k] = (outCount[k] || 0) + 1));

  const rel = v.rel[relIndex(st.env)] / 3;
  const cov = status === 'match' ? 1 : status === 'partial' ? 0.5 : 0;
  const G = st.grav === 'ug' ? 1 : st.grav === '1g' ? (v.g1 ? 1 : 0) : (v.proxy ? 1 : v.g1 ? 0.8 : 0.5);
  const pri = v.pri === 'A' ? 1 : v.pri === 'B' ? 0.6 : 0.3;
  const E = Math.min(1, Math.log10(1 + v.nind + 3 * v.npub) / 3);
  // Two questions are kept apart (commit 11): how compatible the evidence is
  // with this scenario, and how relevant the investigation is to the mission.
  const parts = {Relevance: 35 * rel, Coverage: 30 * cov, Gravity: 15 * G, Pillar: 10 * pri, Evidence: 10 * E};
  const evidenceScore = 100 * (0.55 * cov + 0.25 * G + 0.20 * E);
  const missionScore = 100 * (0.70 * rel + 0.30 * pri);
  return {v, m, status, score: Object.values(parts).reduce((a, b) => a + b, 0), parts,
          evidenceScore, missionScore, n: rows.length, nAll: src.tests.length, missCount, outCount};
}
const RANK_KEY = {evidence:'evidenceScore', relevance:'missionScore', overall:'score'};
function c1List(b){
  const st = b.st, key = RANK_KEY[st.rank] || 'evidenceScore';
  return INV.filter(v => (st.fuel === 'all' || v.st.includes(st.fuel) || (st.fuel === 'solid' && v.st.includes('gas-emulator')) || (v.parent && byId(v.parent).st.includes(st.fuel)))
      && (st.pil === 'all' || v.pil.includes(st.pil)) && (st.grav !== '1g' || v.g1))
    .map(v => evalInv(v, st)).sort((a, b) => b[key] - a[key] || b.score - a.score);
}
function srcInvs(b){
  const a = b.link && blk(b.link); if(!a) return b.st.invs;
  // A comparison the user forced through below the affinity threshold does not
  // become a modelling dataset: fall back to the investigations that match.
  if(a.st.cmp.length && cmpPoolable(a.st)) return a.st.cmp.filter(id => byId(id).nind);
  return c1List(a).filter(r => r.status === 'match' && r.v.nind && !r.v.parent).map(r => r.v.id).slice(0, 6);
}

/* ---------- charts ---------- */
function chart(o){
  const W = o.w || 520, H = o.h || 300, L = 46, R = 12, Tp = 10, B = 36, xr = o.xr, yr = o.yr;
  const X = x => L + (x - xr[0]) / (xr[1] - xr[0]) * (W - L - R), Y = y => H - B - (y - yr[0]) / (yr[1] - yr[0]) * (H - Tp - B);
  const ticks = (r, n) => { const st = (r[1] - r[0]) / n, p = Math.pow(10, Math.floor(Math.log10(st))), s = [1, 2, 2.5, 5, 10].map(m => m * p).find(m => m >= st) || st; const a = []; for(let v = Math.ceil(r[0] / s) * s; v <= r[1] + 1e-9; v += s) a.push(+v.toFixed(6)); return a; };
  let s = `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || '')}">`;
  (o.rects || []).forEach(r => { const x0 = Math.max(xr[0], r.x0), x1 = Math.min(xr[1], r.x1), y0 = Math.max(yr[0], r.y0), y1 = Math.min(yr[1], r.y1); if(x1 > x0 && y1 > y0) s += `<rect x="${X(x0)}" y="${Y(y1)}" width="${X(x1) - X(x0)}" height="${Y(y0) - Y(y1)}" fill="${r.fill || 'var(--g1)'}" fill-opacity=".13" stroke="var(--g1)" stroke-dasharray="4 3"/>` + (r.label ? `<text x="${X(x0) + 4}" y="${Y(y1) + 12}" style="fill:var(--g1)">${esc(r.label)}</text>` : ''); });
  ticks(xr, 6).forEach(v => { s += `<line class="gr" x1="${X(v)}" x2="${X(v)}" y1="${Tp}" y2="${H - B}"/><text x="${X(v)}" y="${H - B + 14}" text-anchor="middle">${nf(v, 2)}</text>`; });
  ticks(yr, 5).forEach(v => { s += `<line class="gr" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${nf(v, 2)}</text>`; });
  s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><line class="ax" x1="${L}" x2="${L}" y1="${Tp}" y2="${H - B}"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${esc(o.xl)}</text><text transform="translate(12 ${(Tp + H - B) / 2}) rotate(-90)" text-anchor="middle">${esc(o.yl)}</text>`;
  (o.hlines || []).forEach(h => { if(h.y >= yr[0] && h.y <= yr[1]) s += `<line x1="${L}" x2="${W - R}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="${h.c || 'var(--ink2)'}" stroke-dasharray="5 4"/><text x="${W - R - 4}" y="${Y(h.y) - 4}" text-anchor="end">${esc(h.label || '')}</text>`; });
  (o.vlines || []).forEach(h => { if(h.x >= xr[0] && h.x <= xr[1]) s += `<line x1="${X(h.x)}" x2="${X(h.x)}" y1="${Tp}" y2="${H - B}" stroke="${h.c || 'var(--ink2)'}" stroke-dasharray="5 4"/><text x="${X(h.x) + 4}" y="${Tp + 11}">${esc(h.label || '')}</text>`; });
  (o.lines || []).forEach(l => { let d = '', pen = false; for(let i = 0; i <= 120; i++){ const x = xr[0] + (xr[1] - xr[0]) * i / 120, y = l.f(x); if(y == null || isNaN(y) || y < yr[0] - 1e-9 || y > yr[1] + 1e-9){ pen = false; continue; } d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); pen = true; } s += `<path d="${d}" fill="none" stroke="${l.c || 'var(--ink)'}" stroke-width="2" ${l.dash ? 'stroke-dasharray="6 4"' : ''}/>`; });
  // Points outside the visible window are counted so the view can say so
  // instead of dropping them silently (commit 10).
  let dropped = 0;
  (o.pts || []).forEach(p => {
    if(p.x == null || p.y == null) return;
    if(p.x < xr[0] || p.x > xr[1] || p.y < yr[0] || p.y > yr[1]){ dropped++; return; }
    const x = X(p.x), y = Y(p.y), r = p.r || 3.5, tt = p.t ? `<title>${esc(p.t)}</title>` : '';
    s += shapeAt(p.shape || (p.hollow ? 'hollowDiamond' : 'circle'), x, y, r, p, tt);
  });
  o.dropped = dropped;
  (o.marks || []).forEach(m => { if(m.x < xr[0] || m.x > xr[1] || m.y < yr[0] || m.y > yr[1]) return; s += `<path d="M${X(m.x) - 7} ${Y(m.y)}H${X(m.x) + 7}M${X(m.x)} ${Y(m.y) - 7}V${Y(m.y) + 7}" stroke="var(--crit)" stroke-width="2.5"/><text x="${X(m.x) + 9}" y="${Y(m.y) - 7}" style="fill:var(--ink);font-weight:600">${esc(m.label || '')}</text>`; });
  return s + '</svg>';
}
/* Marks are distinguished by shape as well as colour, so the chart stays
   readable without relying on colour alone (commit 16). */
function shapeAt(shape, x, y, r, p, tt){
  const fill = p.c || 'var(--s1)', op = p.o != null ? p.o : .75, st = 'stroke="var(--panel)" stroke-width=".8"';
  if(shape === 'square')   return `<rect x="${x - r}" y="${y - r}" width="${2 * r}" height="${2 * r}" fill="${fill}" fill-opacity="${op}" ${st}>${tt}</rect>`;
  if(shape === 'triangle') return `<path d="M${x} ${y - r - 1}L${x + r + 1} ${y + r}L${x - r - 1} ${y + r}Z" fill="${fill}" fill-opacity="${op}" ${st}>${tt}</path>`;
  if(shape === 'diamond')  return `<path d="M${x} ${y - r - 1}L${x + r + 1} ${y}L${x} ${y + r + 1}L${x - r - 1} ${y}Z" fill="${fill}" fill-opacity="${op}" ${st}>${tt}</path>`;
  if(shape === 'hollowDiamond') return `<path d="M${x} ${y - r - 2}L${x + r + 2} ${y}L${x} ${y + r + 2}L${x - r - 2} ${y}Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.8">${tt}</path>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" fill-opacity="${op}" ${st}>${tt}</circle>`;
}
const LEGSHAPE = {circle:'border-radius:50%', square:'border-radius:1px', triangle:'clip-path:polygon(50% 0,100% 100%,0 100%)', diamond:'transform:rotate(45deg)'};
const legend = items => `<div class="legend">${items.map(i => {

/* Outcome styling is driven by the raw outcome code, not by display text, and an

function outcomeStyle(t){

  const baseWork = renderWork; let seen = null, timer = 0;
  renderWork = function(){
    baseWork();
    const b = cur(), w = $id('work');
    if(!b){
      const card = w.querySelector('.card');
      if(card && !card.classList.contains('hero')){
        card.classList.add('hero');
        card.insertAdjacentHTML('beforeend', `<button class="pri hero__cta" data-act="example">Load the example project</button><span class="hero__ring" aria-hidden="true"></span><img class="hero__f0" src="${FLAME_0G}" alt=""><img class="hero__f1" src="${FLAME_1G}" alt="">`);
      }
    }
    const key = b ? b.id + ':' + b.step + ':' + ((b.st && b.st.pil) || '') : 'none';
    if(key === seen) return;
    seen = key;
    w.classList.remove('enter'); void w.offsetWidth; w.classList.add('enter');
    clearTimeout(timer); timer = setTimeout(() => w.classList.remove('enter'), 1200);
  };

  /* ----- pipeline wires: a curve from the source block's right port to the target's left port. When other blocks
     sit between the two, the wire steps over (or under) them; when blocks are stacked in one column it runs down
     their left side. Replaces the app's straight connector; reads the same state and changes nothing. ----- */
  drawWires = function(){
    const sv = $id('wires'), wrap = $id('canvasWrap'); if(!sv || !wrap) return;
    const wr = wrap.getBoundingClientRect(), folded = wrap.classList.contains('min'), B = {};
    wrap.querySelectorAll('.blk').forEach(el => {
      const r = el.getBoundingClientRect(), hd = el.querySelector('.blk-h'); if(!hd) return;
      const h = hd.getBoundingClientRect(), py = folded ? (h.top + h.bottom) / 2 : h.bottom;
      el.style.setProperty('--port', (py - r.top).toFixed(1) + 'px'); el.classList.remove('in', 'out');
      B[el.dataset.blk] = {el, l:r.left - wr.left, r:r.right - wr.left, t:r.top - wr.top, b:r.bottom - wr.top, y:py - wr.top};
    });
    const f = n => n.toFixed(1); let out = '';
    S.blocks.filter(b => b.link && B[b.link] && B[b.id]).forEach(b => {
      const a = B[b.link], z = B[b.id]; let d;
      if(Math.abs(a.l - z.l) < 24){                                   /* one column: down the left side */
        const x = a.l, k = Math.min(26, Math.max(10, x - 4));
        a.el.classList.add('in'); z.el.classList.add('in');
        d = `M${f(x)} ${f(a.y)}C${f(x - k)} ${f(a.y)} ${f(x - k)} ${f(z.y)} ${f(x)} ${f(z.y)}`;
      } else {
        a.el.classList.add('out'); z.el.classList.add('in');
        const x1 = a.r, y1 = a.y, x2 = z.l, y2 = z.y;
        const mids = x2 > x1 ? Object.values(B).filter(m => m !== a && m !== z && m.l >= x1 && m.r <= x2 && m.b > Math.min(a.t, z.t) && m.t < Math.max(a.b, z.b)) : [];
        if(mids.length){
          const xa = (x1 + Math.min(...mids.map(m => m.l))) / 2, xb = (x2 + Math.max(...mids.map(m => m.r))) / 2;
          const over = Math.min(...mids.map(m => m.t)) - 15, under = Math.max(...mids.map(m => m.b)) + 15;
          const yv = over >= Math.min(a.t, z.t) + 8 ? over : under, r = Math.max(4, Math.min(11, xa - x1, x2 - xb));
          const s1 = yv < y1 ? -1 : 1, s2 = y2 < yv ? -1 : 1;
          d = `M${f(x1)} ${f(y1)}H${f(xa - r)}Q${f(xa)} ${f(y1)} ${f(xa)} ${f(y1 + s1 * r)}V${f(yv - s1 * r)}Q${f(xa)} ${f(yv)} ${f(xa + r)} ${f(yv)}H${f(xb - r)}Q${f(xb)} ${f(yv)} ${f(xb)} ${f(yv + s2 * r)}V${f(y2 - s2 * r)}Q${f(xb)} ${f(y2)} ${f(xb + r)} ${f(y2)}H${f(x2)}`;
        } else {
          const dx = x2 > x1 ? Math.max(16, (x2 - x1) * 0.6) : 70;
          d = `M${f(x1)} ${f(y1)}C${f(x1 + dx)} ${f(y1)} ${f(x2 - dx)} ${f(y2)} ${f(x2)} ${f(y2)}`;
        }
      }
      out += `<path class="w0" d="${d}"/><path class="w1" d="${d}"/>` + (still ? '' : `<path class="w2" d="${d}"/>`);
    });
    sv.innerHTML = out;
  };
  window.addEventListener('resize', () => requestAnimationFrame(drawWires));


  /* ----- navigation: the project's blocks in the sidebar; the active one is the ember pill ----- */
  const navBox = $id('navBlocks');
  const baseCanvas = renderCanvas;
  renderCanvas = function(){
    baseCanvas();
    document.querySelectorAll('#canvas .blk').forEach(el => { const ic = el.querySelector('.blk-ic'); if(ic) ic.innerHTML = ICON[el.dataset.type] || ICON.C1; });
    navBox.innerHTML = S.blocks.length ? S.blocks.map(b => { const C = COMP[b.type]; return `<button type="button" class="nav ${b.id === S.active ? 'on' : ''}" data-act="step" data-id="${b.id}" data-step="${b.step || 0}" title="Block ${b.id} · ${C.name} · step ${(b.step || 0) + 1} of ${C.steps.length}" aria-label="Block ${b.id}, ${C.name}, step ${(b.step || 0) + 1} of ${C.steps.length}"><i class="nav__id" aria-hidden="true">${b.id}</i>${ICON[b.type] || ICON.C1}<span>${C.name}</span><em>${(b.step || 0) + 1}/${C.steps.length}</em></button>`; }).join('')
      : `<div class="nav--empty side__text">No blocks yet. Add one below.</div>`;
  };
  document.querySelectorAll('#pal').forEach(p => { p.dataset.label = 'Add a component'; });

  /* ----- rail: the project's blocks only, plus one "add a block" button that opens a menu.

  const railAdd = document.createElement('button'), railSep = document.createElement('div'), addMenu = document.createElement('div');
  railSep.className = 'side__sec side__sec--rail';
  railAdd.id = 'railAdd'; railAdd.type = 'button'; railAdd.title = 'Add a block'; railAdd.innerHTML = svg('<path d="M12 5v14M5 12h14"/>');

  function pillarFolders(b){
    if(!gfRow){
      gfRow = document.createElement('div'); gfRow.className = 'gfrow';
      PILS.forEach(([k, n], i) => {
        const inv = INV.filter(v => v.pil.includes(k)), nx = EXT.filter(x => x.pil.includes(k)).length;
        const f = GF.create({label:n, meta:`${inv.length} investigations · ${nx} external`, tone:theme, art:PILLAR_ART[k], seed:i * 4 + 3, appearDelay:i * 140,
          hit:{'data-act':'set', 'data-key':'pil', 'data-val':k},
          files:inv.slice(0, 4).map((v, idx) => ({name:v.acr, meta:v.id, title:`Open ${v.acr} (${v.id}) in PSI`, href:psi2url(v.id), art:idx % 2 === 1 ? PILLAR_ART[k] : undefined}))});
        /* a click on the open pillar closes or reopens its folder; a click on another pillar selects it (the app's own action) */
        f.hit.addEventListener('click', () => { const c = cur(); gfOpen = c && c.st.pil === k ? !f.open : true; });
        gfBy[k] = f; gfRow.appendChild(f.el);
      });
      if(window.ResizeObserver) new ResizeObserver(gfLayout).observe(gfRow);
      if(window.MutationObserver) new MutationObserver(() => PILS.forEach(([k]) => gfBy[k].setTone(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'))).observe(root, {attributes:true, attributeFilter:['data-theme']});
    }
    const steps = $id('work').querySelector('.steps'); if(!steps) return;
    steps.insertAdjacentElement('afterend', gfRow); gfLayout();
    requestAnimationFrame(() => PILS.forEach(([k]) => gfBy[k].setOpen(gfOpen && b.st.pil === k)));
  }
  const baseWork2 = renderWork;
  renderWork = function(){
    baseWork2();
    const b = cur(), C = b && COMP[b.type];
    $id('pgEyebrow').textContent = b ? `Block ${b.id} · step ${b.step + 1} of ${C.steps.length} · ${C.steps[b.step]}` : 'Flame in Freefall · NASA PSI';
    $id('pgTitle').textContent = b ? C.name : 'Fire safety workbench';
    $id('pgTag').textContent = b ? C.desc : 'NASA PSI data and external evidence, each with its evidence level stated.';
    if(b && b.type === 'C3' && b.step === 0) pillarFolders(b);
  };

  /* ----- opening the copilot from the search field puts the cursor in its question box ----- */
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-act="toggleAi"]'); if(!t) return;
    setTimeout(() => { if(!$id('app').classList.contains('noai')){ const q = $id('aiQ'); if(q) q.focus(); } }, 60);
  });

  /* ----- charts: zoom and pan, a live readout, and labels kept on top -----
     The app draws every chart from an options object (ranges, points, lines). This keeps that object and, to zoom,
     asks the app's own chart function to draw the same data over a narrower range at the size of its box. Nothing
     in the app's state or data changes, and the points left outside a zoomed view are counted and reported. */
  const baseChart = chart, CH = [], ZOOM = {};
  chart = function(o){ const out = baseChart(o), id = CH.push(o) - 1; return out.replace('<svg class="ch"', `<svg class="ch" data-ch="${id}"`); };
  const tip = document.createElement('div'); tip.className = 'chtip'; tip.hidden = true; document.body.appendChild(tip);
  const clampN = (v, a, b) => Math.min(Math.max(v, a), b), axisName = l => String(l || '').split(' (')[0];
  function zoomable(svgEl, o, key){
    const sig = JSON.stringify([o.xr, o.yr]);
    let z = ZOOM[key]; if(!z || z.sig !== sig) z = ZOOM[key] = {sig, xr:o.xr.slice(), yr:o.yr.slice()};
    const win = (o.rects || [])[0], total = (o.pts || []).filter(p => p.x != null && p.y != null).length;
    const box = document.createElement('div'); box.className = 'chz';
    box.innerHTML = `<div class="chz__bar"><span class="sp"></span>${win ? `<button type="button" data-z="win">Zoom to ${win.label ? esc(win.label.toLowerCase()) : 'the marked region'}</button>` : ''}<button type="button" data-z="out" aria-label="Zoom out" title="Zoom out">−</button><button type="button" data-z="in" aria-label="Zoom in" title="Zoom in">+</button><button type="button" data-z="reset">Reset</button></div><div class="chz__plot"><div class="chz__svg"></div><span class="chz__read" aria-hidden="true"></span></div><div class="chz__info small muted"></div>`;
    svgEl.replaceWith(box);
    const plot = box.querySelector('.chz__plot'), stage = box.querySelector('.chz__svg'), read = box.querySelector('.chz__read'), info = box.querySelector('.chz__info'), btn = k => box.querySelector(`[data-z="${k}"]`);
    let W = 520, H = 300; const L = 46, R = 12, Tp = 10, B = 36;
    const isZoomed = () => z.xr[0] !== o.xr[0] || z.xr[1] !== o.xr[1] || z.yr[0] !== o.yr[0] || z.yr[1] !== o.yr[1];
    function draw(){
      W = Math.round(clampN(plot.clientWidth - 8 || 520, 340, 760)); H = Math.round(clampN(W * 0.6, 250, 400));
      const c = {...o, xr:z.xr, yr:z.yr, w:W, h:H};
      stage.innerHTML = baseChart(c);
      const svg = stage.firstElementChild;
      /* a region's label sits above its box and is drawn last, so the points never cover it */
      svg.querySelectorAll('rect[stroke-dasharray="4 3"] + text').forEach(t => { const r = t.previousElementSibling; t.setAttribute('y', Math.max(Tp + 10, +r.getAttribute('y') - 6)); t.classList.add('chz__lab'); svg.appendChild(t); });
      /* each point's description becomes an instant tooltip instead of the browser's slow one */
      svg.querySelectorAll('title').forEach(t => { t.parentNode.dataset.t = t.textContent; t.remove(); });
      const zoomed = isZoomed();
      plot.classList.toggle('can-pan', zoomed); btn('reset').disabled = !zoomed; btn('out').disabled = !zoomed;
      info.textContent = zoomed
        ? `Zoomed view: ${axisName(o.xl)} ${nf(z.xr[0], 1)} to ${nf(z.xr[1], 1)}, ${axisName(o.yl)} ${nf(z.yr[0], 1)} to ${nf(z.yr[1], 1)}. ${c.dropped} of ${total} ${plural(total, 'point')} ${c.dropped === 1 ? 'is' : 'are'} outside this view. Drag to move.`
        : 'Zoom with + and −, a double-click, or a pinch (Ctrl or ⌘ + scroll). Hover a point to read it.';
    }
    const geo = () => { const r = stage.firstElementChild.getBoundingClientRect(), sx = r.width / W, sy = r.height / H; return {left:r.left + L * sx, w:(W - L - R) * sx, bottom:r.top + (H - B) * sy, h:(H - Tp - B) * sy}; };
    const at = ev => { const g = geo(); return {fx:clampN((ev.clientX - g.left) / g.w, 0, 1), fy:clampN((g.bottom - ev.clientY) / g.h, 0, 1), g}; };
    const fit = (r, base) => { const span = Math.min(r[1] - r[0], base[1] - base[0]), lo = clampN(r[0], base[0], base[1] - span); return [lo, lo + span]; };
    function zoomAt(fx, fy, k){
      [['xr', fx], ['yr', fy]].forEach(([a, f]) => { const base = o[a], full = base[1] - base[0], span = clampN((z[a][1] - z[a][0]) * k, full / 400, full), pivot = z[a][0] + f * (z[a][1] - z[a][0]); z[a] = fit([pivot - f * span, pivot - f * span + span], base); });
      draw();
    }
    box.querySelector('.chz__bar').addEventListener('click', ev => {
      const k = ev.target.closest('[data-z]'); if(!k) return; const a = k.dataset.z;
      if(a === 'in') zoomAt(0.5, 0.5, 0.6); else if(a === 'out') zoomAt(0.5, 0.5, 1 / 0.6);
      else if(a === 'reset'){ z.xr = o.xr.slice(); z.yr = o.yr.slice(); draw(); }
      else if(a === 'win' && win){ const px = Math.max((win.x1 - win.x0) * 0.9, (o.xr[1] - o.xr[0]) * 0.04), py = Math.max((win.y1 - win.y0) * 0.9, (o.yr[1] - o.yr[0]) * 0.04); z.xr = fit([win.x0 - px, win.x1 + px], o.xr); z.yr = fit([win.y0 - py, win.y1 + py], o.yr); draw(); }
    });
    plot.addEventListener('dblclick', ev => { const p = at(ev); zoomAt(p.fx, p.fy, ev.shiftKey ? 2 : 0.5); });
    plot.addEventListener('wheel', ev => { if(!(ev.ctrlKey || ev.metaKey)) return; ev.preventDefault(); const p = at(ev); zoomAt(p.fx, p.fy, clampN(Math.exp(ev.deltaY * 0.012), 0.5, 2)); }, {passive:false});
    let drag = null, pend = 0;
    plot.addEventListener('pointerdown', ev => { if(ev.button !== 0 || !isZoomed()) return; drag = {x:ev.clientX, y:ev.clientY, xr:z.xr.slice(), yr:z.yr.slice(), g:geo()}; plot.setPointerCapture(ev.pointerId); plot.classList.add('panning'); tip.hidden = true; });
    plot.addEventListener('pointermove', ev => {
      if(drag){
        const sx = drag.xr[1] - drag.xr[0], sy = drag.yr[1] - drag.yr[0];
        z.xr = fit([drag.xr[0] - (ev.clientX - drag.x) / drag.g.w * sx, drag.xr[1] - (ev.clientX - drag.x) / drag.g.w * sx], o.xr);
        z.yr = fit([drag.yr[0] + (ev.clientY - drag.y) / drag.g.h * sy, drag.yr[1] + (ev.clientY - drag.y) / drag.g.h * sy], o.yr);
        if(!pend) pend = requestAnimationFrame(() => { pend = 0; draw(); });
        return;
      }
      const p = at(ev); read.textContent = `${axisName(o.xl)} ${nf(z.xr[0] + p.fx * (z.xr[1] - z.xr[0]), 1)} · ${axisName(o.yl)} ${nf(z.yr[0] + p.fy * (z.yr[1] - z.yr[0]), 1)}`;
      const el = ev.target.closest && ev.target.closest('[data-t]');
      if(el){ tip.textContent = el.dataset.t; tip.hidden = false; const tw = tip.offsetWidth, th = tip.offsetHeight; tip.style.left = clampN(ev.clientX + 14, 8, window.innerWidth - tw - 8) + 'px'; tip.style.top = (ev.clientY - th - 12 < 8 ? ev.clientY + 16 : ev.clientY - th - 12) + 'px'; }
      else tip.hidden = true;
    });
    const end = () => { drag = null; plot.classList.remove('panning'); };
    plot.addEventListener('pointerup', end); plot.addEventListener('pointercancel', end);
    plot.addEventListener('pointerleave', () => { tip.hidden = true; read.textContent = ''; });
    let lastW = 0; if(window.ResizeObserver) new ResizeObserver(() => { const w = plot.clientWidth; if(w && Math.abs(w - lastW) > 6){ lastW = w; draw(); } }).observe(plot);
    lastW = plot.clientWidth; draw();
  }
  const baseWork3 = renderWork;
  renderWork = function(){
    CH.length = 0; tip.hidden = true;
    baseWork3();
    const b = cur(), view = b ? [b.id, b.step, (b.st && b.st.pil) || '', (b.st && b.st.yax) || ''].join(':') : 'none';
    $id('work').querySelectorAll('svg.ch[data-ch]').forEach((el, i) => { const o = CH[+el.dataset.ch]; if(o && o.xr && o.yr) zoomable(el, o, view + '#' + i); });
  };

  renderPal(); renderCanvas(); renderWork();

  /* ----- copilot: K opens it; a soft chime when an answer lands ----- */
  document.addEventListener('keydown', ev => {
    const el = ev.target, typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
    if(typing || ev.metaKey || ev.ctrlKey || ev.altKey || ev.key.toLowerCase() !== 'k') return;
    ev.preventDefault(); $id('btnAi').click();
    if(!$id('app').classList.contains('noai')){ const q = $id('aiQ'); if(q) q.focus(); }
  });
  const aiPanel = $id('ai'); let lastChime = 0;
  if(window.MutationObserver && aiPanel) new MutationObserver(() => { const now = Date.now(); if($id('aiAns') && now - lastChime > 900){ lastChime = now; sfx.chime(); } }).observe(aiPanel, {childList:true, subtree:true});
})();
</script>
</body>
</html>
